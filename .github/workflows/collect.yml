name: GMX G5 fixed-window collection

on:
  schedule:
    - cron: '25 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      pilot:
        description: 'Run the disclosed Sep 26 pilot without touching the prospective receipts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gmx-g5-fixed-window
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out collection record
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install on-chain hashing dependency
        run: python -m pip install pycryptodome==3.23.0
      - name: Collect fixed-time data or run pre-window pilot
        env:
          PILOT: ${{ inputs.pilot }}
        run: |
          if [ "$PILOT" = 'true' ]; then
            python -m scripts.collect_gmx_g5_window --pilot-day 2026-09-26
          else
            python -m scripts.collect_gmx_g5_window
          fi
      - name: Commit non-identifying receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No receipt changes.'
            exit 0
          fi
          git commit -m 'Record fixed-window G5 aggregate receipt'
          git push
