name: GMX G5 fixed-window collection

on:
  schedule:
    - cron: '25 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      pilot:
        description: 'Run the disclosed Sep 26 pilot without touching the prospective receipts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gmx-g5-fixed-window
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out collection record
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install pycryptodome==3.23.0 pytest==9.1.1
      - name: Check collector and ABI decoding offline
        run: python -m pytest -q tests/test_gmx_window_collector.py tests/test_gmx_onchain_probe.py
      - name: Retrieve all due primary snapshots first
        env:
          PILOT: ${{ inputs.pilot }}
        run: |
          if [ "$PILOT" = 'true' ]; then
            python -m scripts.collect_gmx_g5_window --pilot-day 2026-09-26 --phase primary
          else
            python -m scripts.collect_gmx_g5_window --phase primary
          fi
      - name: Preserve primary receipts before slower chain reads
        run: bash deployment/g5-remote/commit-receipts.sh
      - name: Compute final primary result when window complete
        env:
          PILOT: ${{ inputs.pilot }}
        run: |
          if [ "$PILOT" != 'true' ]; then
            python -m scripts.collect_gmx_g5_window --phase finalize
          fi
      - name: Preserve final primary result
        run: bash deployment/g5-remote/commit-receipts.sh
      - name: Run independent same-block chain checks
        env:
          PILOT: ${{ inputs.pilot }}
        run: |
          if [ "$PILOT" = 'true' ]; then
            python -m scripts.collect_gmx_g5_window --pilot-day 2026-09-26 --phase independent
          else
            python -m scripts.collect_gmx_g5_window --phase independent
          fi
      - name: Preserve chain-check receipts
        if: always()
        run: bash deployment/g5-remote/commit-receipts.sh
      - name: Refresh final chain-validation status
        if: always()
        env:
          PILOT: ${{ inputs.pilot }}
        run: |
          if [ "$PILOT" != 'true' ]; then
            python -m scripts.collect_gmx_g5_window --phase finalize
          fi
      - name: Preserve final status
        if: always()
        run: bash deployment/g5-remote/commit-receipts.sh
